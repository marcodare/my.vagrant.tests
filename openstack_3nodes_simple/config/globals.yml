---
# OpenStack 2025.2, Ubuntu 24.04: un control plane semplice, non HA.
kolla_base_distro: "ubuntu"
openstack_release: "2025.2"
network_interface: "enpmgmt"
kolla_internal_vip_address: "192.168.63.5"
# Questa NIC è intenzionalmente senza IP: Neutron la collega al bridge esterno.
neutron_external_interface: "enpext"
neutron_plugin_agent: "openvswitch"
enable_neutron_provider_networks: "yes"
nova_compute_virt_type: "kvm"
enable_horizon: "yes"
enable_cinder: "no"
enable_heat: "no"
enable_prometheus: "no"
